<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#FFF9EC" />
    <title>The Good Hours</title>

    <!-- Start the fonts downloading in parallel with the JS bundle -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!--
      Boot splash: plain HTML/CSS so it paints the instant the page arrives,
      instead of leaving a grey webview while the JS bundle downloads.
      main.jsx fades it out once React has mounted its own (identical) splash.
    -->
    <style>
      html, body { margin: 0; background: #FFF9EC; }
      #boot-splash {
        position: fixed; inset: 0; z-index: 9999;
        background: #FFF9EC;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
        transition: opacity .35s ease;
      }
      #boot-splash .word {
        font-family: 'Baloo 2', 'Trebuchet MS', sans-serif;
        font-size: 36px; font-weight: 800; color: #2E294E; letter-spacing: -.01em;
      }
      #boot-splash .good {
        background: #FF5D8F; color: #fff; padding: 1px 9px; border-radius: 9px;
        box-shadow: 2px 2px 0 #2E294E; display: inline-block;
        animation: bootWiggle 2.6s ease-in-out infinite;
      }
      #boot-splash .dots { display: flex; gap: 8px; }
      #boot-splash .dots i {
        width: 9px; height: 9px; border-radius: 50%; display: block;
        animation: bootBounce 1.1s ease-in-out infinite;
      }
      #boot-splash svg { animation: bootBob 3.2s ease-in-out infinite; transform-origin: center; }
      @keyframes bootBob { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-4px) rotate(2deg); } }
      @keyframes bootWiggle { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(-1deg); } }
      @keyframes bootBounce { 0%,80%,100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-7px); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash svg, #boot-splash .good, #boot-splash .dots i { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <svg width="96" height="96" viewBox="0 0 64 64" aria-hidden="true">
        <g stroke="#FFB627" stroke-width="5" stroke-linecap="round">
          <line x1="56" y1="32" x2="62" y2="32" /><line x1="48.97" y1="48.97" x2="53.21" y2="53.21" />
          <line x1="32" y1="56" x2="32" y2="62" /><line x1="15.03" y1="48.97" x2="10.79" y2="53.21" />
          <line x1="8" y1="32" x2="2" y2="32" /><line x1="15.03" y1="15.03" x2="10.79" y2="10.79" />
          <line x1="32" y1="8" x2="32" y2="2" /><line x1="48.97" y1="15.03" x2="53.21" y2="10.79" />
        </g>
        <circle cx="32" cy="32" r="19" fill="#FFB627" />
        <circle cx="32" cy="32" r="19" fill="none" stroke="#2E294E" stroke-width="2.5" />
        <circle cx="25.5" cy="29" r="2.6" fill="#2E294E" /><circle cx="38.5" cy="29" r="2.6" fill="#2E294E" />
        <circle cx="22" cy="35.5" r="3.2" fill="#FF5D8F" opacity=".55" /><circle cx="42" cy="35.5" r="3.2" fill="#FF5D8F" opacity=".55" />
        <path d="M24 36.5 Q32 44.5 40 36.5" fill="none" stroke="#2E294E" stroke-width="2.8" stroke-linecap="round" />
      </svg>
      <div class="word">the <span class="good">good</span> hours</div>
      <div class="dots">
        <i style="background:#FF5D8F"></i>
        <i style="background:#FFB627; animation-delay:.15s"></i>
        <i style="background:#17C3B2; animation-delay:.3s"></i>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
